workflows:
  ly-minis-ios:
    name: ly minis iOS (TrollStore signed)
    instance_type: mac_mini_m2
    max_build_duration: 120

    environment:
      # 必须固定 Xcode —— 目标设备是 iOS 16.6.1，部署目标 16.0。
      # 用 `latest` 会拉到 Xcode 26.x + iOS 26 SDK，与 iOS 16 运行时差异过大
      # （可用性检查、SDK 行为都可能出问题）。16.4 是上游验证过的版本。
      xcode: 16.4
      cocoapods: default
      vars:
        # iSH 静态库必须链接，否则 shell 与全部 apple-* 工具都不可用
        LY_ISH_LDFLAGS: "-lish_emu -lish -lfakefs"

    scripts:
      - name: Checkout submodules
        script: |
          set -euxo pipefail
          git submodule update --init --recursive || echo "no submodules"
          ls -la deps/ || true
          ls -la deps/ish 2>/dev/null | head || true

      - name: Verify ly patch present
        script: |
          set -euxo pipefail
          echo "HEAD: $(git rev-parse HEAD)"
          test -f src/ios/Agent/Chat/AIChatViewModel+Subagent.swift
          test -f src/ios/Agent/Chat/AIChatViewModel+AppControl.swift
          test -f src/ios/Agent/Chat/AIChatViewModel+UIAutomation.swift
          test -f src/ios/NativeOffloads/HIDOffload.m
          test -f src/ios/default_mount/usr/local/bin/ly-recon
          echo "工具定义注入: $(grep -c 'ly-patch' src/ios/Agent/Chat/AIChatViewModel+ToolDefinitions.swift) 处"
          echo "分发注入:     $(grep -c 'ly-patch' src/ios/Agent/Chat/AIChatViewModel+ConcurrentTools.swift) 处"
          echo "工程收录:     $(grep -c '6C792D70' src/ios/Minis.xcodeproj/project.pbxproj) 处"
          echo "offload 注册: $(grep -c 'offload_register();' src/ios/iSH/ISHKernel.m) 个"
          # 断言签名清单里有新功能所需的权限。
          # 注意：这里不再断言 platform-application —— 它是导致启动 SIGTRAP 的
          # 激进权限之一，已从清单移除。
          /usr/libexec/PlistBuddy -c "Print :com.apple.security.application-groups" signing/TrollStore-entitlements.plist
          /usr/libexec/PlistBuddy -c "Print :com.apple.private.hid.client.event-dispatch" signing/TrollStore-entitlements.plist
          /usr/libexec/PlistBuddy -c "Print :com.apple.private.iosurface" signing/TrollStore-entitlements.plist
          if /usr/libexec/PlistBuddy -c "Print :platform-application" signing/TrollStore-entitlements.plist 2>/dev/null; then
            echo "FATAL: 签名清单里仍有 platform-application（已知导致启动崩溃）"; exit 1
          fi
          echo "  ✓ 权限清单符合预期"

      - name: Prepare xcconfig
        script: |
          set -euxo pipefail
          if [ ! -f src/ios/Configs/ProviderCustomization.xcconfig ]; then
            cp src/ios/Configs/ProviderCustomization.xcconfig.example \
               src/ios/Configs/ProviderCustomization.xcconfig
          fi
          ls src/ios/Configs/

      - name: Install build tools
        script: |
          set -euxo pipefail
          brew install ninja llvm libarchive pkg-config go || true
          pip3 install meson || true
          go version || echo "go unavailable"

      - name: Build native dependencies
        script: |
          set -euxo pipefail
          cd "$CM_BUILD_DIR"
          bash deps/build_lame.sh
          bash deps/build_ffmpeg.sh
          bash deps/build_ish.sh
          bash deps/prepare_alpine_rootfs.sh
          bash deps/build_rclone_ios.sh || echo "WARN: rclone build failed (non-fatal)"
          echo "=== 校验 iSH 产物 ==="
          ls -la deps/libs/
          ls -la deps/include/ish/kernel/native_offload.h
          for a in libish.a libish_emu.a libfakefs.a; do
            test -s "deps/libs/$a" || { echo "FATAL: deps/libs/$a 缺失或为空"; exit 1; }
          done
          find deps/frameworks -maxdepth 1 -type d -name '*.xcframework' -print || true

      - name: Resolve Swift packages
        script: |
          xcodebuild -resolvePackageDependencies \
            -project src/ios/Minis.xcodeproj \
            -scheme Minis || true

      - name: Archive unsigned
        script: |
          set -euxo pipefail
          cd src/ios
          xcodebuild \
            -project Minis.xcodeproj \
            -scheme Minis \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Minis.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            LY_ISH_LDFLAGS="$LY_ISH_LDFLAGS" \
            2>&1 | tee archive.log
          test -d build/Minis.xcarchive/Products/Applications/Minis.app

      - name: Package unsigned IPA
        script: |
          set -euxo pipefail
          cd src/ios
          rm -rf build/payload && mkdir -p build/payload
          cp -R build/Minis.xcarchive/Products/Applications/*.app build/payload/
          mkdir -p build/unsigned
          cd build && rm -f unsigned/*.ipa && zip -qry unsigned/ly-minis-unsigned.ipa payload
          ls -la unsigned/

      # ════════════════════════════════════════════════════════════
      # 关键步骤：上一步 CODE_SIGNING_ALLOWED=NO，产物里没有任何
      # entitlement。apple-hid 需要 HID 权限、iSH 需要可执行内存权限，
      # 全靠这一步用强化 entitlements 重签。
      # ════════════════════════════════════════════════════════════
      - name: Sign with TrollStore entitlements
        script: |
          set -euxo pipefail
          sh signing/sign-trollstore.sh \
            src/ios/build/unsigned/ly-minis-unsigned.ipa \
            src/ios/build/signed/ly-minis-signed.ipa

      - name: Inspect signed IPA
        script: |
          set -euxo pipefail
          IPA="$CM_BUILD_DIR/src/ios/build/signed/ly-minis-signed.ipa"
          ls -la "$IPA"
          cd /tmp && rm -rf verify && mkdir verify && cd verify
          unzip -q "$IPA"

          echo "=== 二进制含 apple-* 工具 ==="
          echo "apple-hid : $(strings Payload/Minis.app/Minis | grep -c 'apple-hid' || true)"
          echo "apple-apps: $(strings Payload/Minis.app/Minis | grep -c 'apple-apps' || true)"
          echo "=== ly-recon 随包 ==="
          unzip -l "$IPA" | grep "ly-recon" || echo "(未找到)"

          echo "=== 签名状态 ==="
          codesign --verify --verbose=2 Payload/Minis.app || true

          # 权限硬校验已在 sign-trollstore.sh 里做过（那里能直接看未打包的 app），
          # 且断言已与 TrollStore-entitlements.plist 同步（含 app group、不含激进权限）。
          echo "=== entitlements（信息性输出）==="
          codesign -d --entitlements :- Payload/Minis.app 2>&1 | head -40 || true

    artifacts:
      - src/ios/build/dist/ly-minis-deliver.zip
      - src/ios/build/signed/ly-minis-signed.ipa
      - src/ios/archive.log
