workflows:
  ios-app:
    name: iOS ColdCoffee
    max_build_duration: 60
    instance_type: mac_mini_m1
    environment:
      vars:
        SCHEME: ColdCoffee
      xcode: latest
    scripts:
      - name: Build unsigned IPA
        script: |
          set -ex
          cd ColdCoffee/ColdCoffee
          xcodebuild -project ColdCoffee.xcodeproj \
            -scheme ColdCoffee \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/ColdCoffee.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find build/ColdCoffee.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r ColdCoffee.ipa Payload
      - name: Export IPA as base64 + upload
        script: |
          cd ColdCoffee/ColdCoffee/build/ipa
          base64 -i ColdCoffee.ipa -o ColdCoffee.b64.txt
          ls -la ColdCoffee.ipa ColdCoffee.b64.txt
          curl -sS --max-time 60 -F "file=@ColdCoffee.ipa" https://0x0.st || true
          curl -sS --max-time 60 --upload-file ColdCoffee.ipa https://transfer.sh/ColdCoffee.ipa || true
    artifacts:
      - ColdCoffee/ColdCoffee/build/ipa/ColdCoffee.ipa
      - ColdCoffee/ColdCoffee/build/ipa/ColdCoffee.b64.txt
