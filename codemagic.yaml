workflows:
  ios-app:
    name: OpenMinis ly minis (unsigned IPA)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        SCHEME: Minis
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
      xcode: latest
    scripts:
      - name: Setup toolchain
        script: |
          set -ex
          brew install ninja llvm libarchive pkg-config || brew upgrade ninja llvm libarchive pkg-config
          pip3 install --user meson
          echo 'SUBMODULES'
          git submodule update --init --recursive
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$PATH"
          echo "export CM_BUILD_PATH=\"$PATH\"" >> /tmp/env.sh
      - name: Build native deps (lame)
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$PATH"
          ./deps/build_lame.sh
      - name: Build native deps (ffmpeg)
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$PATH"
          ./deps/build_ffmpeg.sh
      - name: Build native deps (ish kernel)
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$PATH"
          ./deps/build_ish.sh
      - name: Prepare alpine rootfs
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$PATH"
          ./deps/prepare_alpine_rootfs.sh
      - name: Build unsigned IPA
        script: |
          set -ex
          cd src/ios
          xcodebuild -project Minis.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Minis.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find build/Minis.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r Minis.ipa Payload
      - name: Export IPA as base64 + upload
        script: |
          cd src/ios/build/ipa
          base64 -i Minis.ipa -o Minis.b64.txt
          ls -la Minis.ipa Minis.b64.txt
    artifacts:
      - src/ios/build/ipa/*.ipa
      - src/ios/build/ipa/*.b64.txt
