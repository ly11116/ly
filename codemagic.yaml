workflows:
  ios-app:
    name: OpenMinis ly minis (unsigned IPA)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        SCHEME: Minis
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
      xcode: latest
    cache:
      cache_paths:
        - deps/lame-build
        - deps/frameworks
        - deps/libs
        - deps/include
        - deps/resources
        - deps/build
        - deps/ish/build-ios
        - $FCI_BUILD_DIR/../DerivedData
    scripts:
      - name: Setup toolchain
        script: |
          set -exo pipefail
          brew install ninja llvm libarchive pkg-config meson go 2>/dev/null || true
          command -v meson || python3 -m pip install --user --break-system-packages meson || python3 -m pip install --user meson
          echo "=== tool versions ==="
          which python3; python3 --version
          which meson ninja go clang
          echo 'SUBMODULES'
          git submodule update --init --recursive
          test -d deps/ish/asbestos && echo "deps/ish OK"
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build native deps (lame)
        script: |
          set -exo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          ./deps/build_lame.sh
      - name: Build native deps (ffmpeg)
        script: |
          set -exo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          ./deps/build_ffmpeg.sh
      - name: Build native deps (ish kernel)
        script: |
          set -exo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.12/bin:$HOME/Library/Python/3.13/bin:$PATH"
          echo "python3: $(which python3) $(python3 --version 2>&1)"
          echo "meson: $(which meson || echo MISSING)"
          # 换健壮版 staticdefine.sh（原版死板砍尾9token，clang flag 变多就砍错）
          cp deps/patches/staticdefine-fix.sh deps/ish/tools/staticdefine.sh
          chmod +x deps/ish/tools/staticdefine.sh
          # ninja -v 让失败命令完整可见
          sed -i '' 's/ninja -C /ninja -v -C /g' deps/build_ish.sh
          LOG=/tmp/ish_build.log
          if ! ./deps/build_ish.sh 2>&1 | tee "$LOG"; then
            echo "##### ISH BUILD FAILED #####"
            grep -n -B8 -A20 -iE "FAILED|error:|traceback|command not found|not found" "$LOG" | tail -100
            echo "##### 原始末尾 40 行 #####"
            tail -40 "$LOG"
            exit 1
          fi
          # ish.h 必须产出，否则后面 Xcode 必挂 —— 这一步就断言
          ls deps/include/ish/ish.h && echo "ish.h OK"
      - name: Prepare alpine rootfs
        script: |
          set -exo pipefail
          ./deps/prepare_alpine_rootfs.sh
      - name: Build rclone XCFramework
        script: |
          set -exo pipefail
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$PATH"
          which go && go version
          ./deps/build_rclone_ios.sh
          ls -la deps/frameworks/Rclone.xcframework
      - name: Verify & patch resources before IPA
        script: |
          set -exo pipefail
          ls -la deps/resources deps/frameworks deps/include deps/libs 2>&1 | head -30
          if [ ! -d deps/resources/RootfsPatch.bundle ]; then
            cp -R deps/ish/app/RootfsPatch.bundle deps/resources/
            echo "RootfsPatch.bundle fallback copied"
          fi
          test -d deps/resources/RootfsPatch.bundle && echo "RootfsPatch OK"
          ls deps/resources/alpine-rootfs.zip && echo "rootfs zip OK"
          ls deps/frameworks/Rclone.xcframework && echo "Rclone OK"
          ls deps/include/ish/ish.h && echo "ish.h OK"
      - name: Build unsigned IPA
        script: |
          set -exo pipefail
          cd src/ios
          xcodebuild -project Minis.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Minis.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find build/Minis.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r Minis.ipa Payload
      - name: Export IPA as base64 + upload
        script: |
          set -ex
          cd src/ios/build/ipa
          base64 -i Minis.ipa -o Minis.b64.txt
          ls -la Minis.ipa Minis.b64.txt
    artifacts:
      - src/ios/build/ipa/*.ipa
      - src/ios/build/ipa/*.b64.txt
