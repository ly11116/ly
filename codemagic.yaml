workflows:
  ios-app:
    name: OpenMinis ly minis (unsigned IPA)
    max_build_duration: 120
    instance_type: mac_mini_m1
    environment:
      vars:
        SCHEME: Minis
        HOMEBREW_NO_AUTO_UPDATE: "1"
        HOMEBREW_NO_ANALYTICS: "1"
      xcode: latest
    scripts:
      - name: Setup toolchain
        script: |
          set -ex
          brew install ninja llvm libarchive pkg-config meson 2>/dev/null || brew upgrade meson || \
            { python3 -m pip install --user --break-system-packages meson || python3 -m pip install --user meson; }
          echo "=== tool versions ==="
          which python3; python3 --version
          ls "$HOME/Library/Python/" 2>/dev/null || true
          echo 'SUBMODULES'
          git submodule update --init --recursive
          test -d deps/ish/asbestos && echo "deps/ish OK"
          cp src/ios/Configs/ProviderCustomization.xcconfig.example src/ios/Configs/ProviderCustomization.xcconfig
      - name: Build native deps (lame)
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.13/bin:$PATH"
          ./deps/build_lame.sh
      - name: Build native deps (ffmpeg)
        script: |
          set -ex
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.13/bin:$PATH"
          ./deps/build_ffmpeg.sh
      - name: Build native deps (ish kernel)
        script: |
          set -e
          export PATH="/opt/homebrew/opt/llvm/bin:/opt/homebrew/bin:$HOME/.local/bin:$HOME/Library/Python/3.9/bin:$HOME/Library/Python/3.11/bin:$HOME/Library/Python/3.13/bin:$PATH"
          echo "python3: $(which python3) $(python3 --version 2>&1)"
          echo "meson: $(which meson || echo MISSING)"
          sed -i '' 's/ninja -C /ninja -v -C /g' deps/build_ish.sh
          # staticdefine.sh 加 set -x trace（BSD sed 不认 GNU 的 2i，用 head/tail 拼）
          SD=deps/ish/tools/staticdefine.sh
          { head -1 "$SD"; echo "set -x"; tail -n +2 "$SD"; } > "$SD.new" && mv "$SD.new" "$SD" && chmod +x "$SD"
          LOG=/tmp/ish_build.log
          if ! ./deps/build_ish.sh 2>&1 | tee "$LOG"; then
            echo "##### ISH BUILD FAILED — grep FAILED/error 上下文 #####"
            grep -n -B8 -A20 -iE "FAILED|error:|traceback|command not found" "$LOG" | tail -80
            echo "##### 原始末尾 40 行 #####"
            tail -40 "$LOG"
            exit 1
          fi
      - name: Prepare alpine rootfs
        script: |
          set -ex
          ./deps/prepare_alpine_rootfs.sh
      - name: Build unsigned IPA
        script: |
          set -ex
          cd src/ios
          xcodebuild -project Minis.xcodeproj \
            -scheme "$SCHEME" \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath build/Minis.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH=$(find build/Minis.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/ipa/Payload
          cp -r "$APP_PATH" build/ipa/Payload/
          cd build/ipa && zip -r Minis.ipa Payload
      - name: Export IPA as base64 + upload
        script: |
          cd src/ios/build/ipa
          base64 -i Minis.ipa -o Minis.b64.txt
          ls -la Minis.ipa Minis.b64.txt
    artifacts:
      - src/ios/build/ipa/*.ipa
      - src/ios/build/ipa/*.b64.txt
